name: Validate and Format Markdown Content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  PRETTIER_VERSION: "3.9.10"
  MARKDOWNLINT_CLI2_VERSION: "0.24.0"
  RUFF_VERSION: "0.17.3"
  ZIZMOR_VERSION: "1.31.1"
  ACTIONLINT_IMAGE: "rhysd/actionlint:1.7.12"

jobs:
  validate:
    name: Validate content vault
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate questions, links, and indexes
        run: python3 scripts/validate_content.py

      - name: Fail if indexes are stale
        run: python3 scripts/generate_indexes.py --check

      - name: Fail if the knowledge graph is stale
        run: python3 scripts/build_knowledge_graph.py --check

      - name: Fail if the quiz data feed is stale
        run: python3 scripts/build_quiz_data.py --check

  python:
    name: Lint and test Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Dev-only: the scripts themselves stay stdlib-only.
      - name: Install ruff
        run: python3 -m pip install --quiet "ruff==${RUFF_VERSION}"

      - name: Lint with ruff
        run: ruff check --output-format=github scripts tests

      - name: Check formatting with ruff
        run: ruff format --check scripts tests

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  lint:
    name: Lint and format Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check formatting with Prettier
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check "**/*.md"

      - name: Lint with markdownlint
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" "**/*.md"

  workflows:
    name: Lint and audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint with actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit with zizmor
        run: |
          python3 -m pip install --quiet "zizmor==${ZIZMOR_VERSION}"
          zizmor --offline --format=github .github/workflows

  pr-success-comment:
    if: github.event_name == 'pull_request'
    needs: [validate, python, lint, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Post success comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = "<!-- validation-success -->";

            const body = `${marker}
            ## ✅ All automated checks passed

            The following checks completed successfully:

            - ✅ Content validation
            - ✅ Index, knowledge graph, and quiz feed freshness
            - ✅ Python lint, format, and unit tests
            - ✅ Markdown formatting
            - ✅ Markdown linting
            - ✅ Workflow lint and security audit

            Your contribution is ready for review. 🎉`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );

            const existing = comments.find(
              c =>
                c.user.type === "Bot" &&
                c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

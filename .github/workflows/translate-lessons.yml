name: Translate Lessons

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/i18n.json"
      - "scripts/translate_lessons.py"
  schedule:
    - cron: "17 3 * * 1" # weekly, to finish any run that was cut short
  workflow_dispatch:
    inputs:
      languages:
        description: "Space-separated language codes (blank = all in scripts/i18n.json)"
        required: false
        default: ""
      limit:
        description: "Max pages per language this run (0 = no limit)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: translate-lessons
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  translate:
    name: Translate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
      TRANSLATE_CONCURRENCY: "8"

    steps:
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret is not set - skipping lesson translation."

      # Credentials stay configured: the last step pushes the translations branch, and this job
      # uploads no artifacts that could leak them.
      - name: Checkout Repository # zizmor: ignore[artipacked]
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve languages
        id: langs
        if: env.ANTHROPIC_API_KEY != ''
        env:
          REQUESTED: ${{ inputs.languages }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          # Dispatch inputs are checked against scripts/i18n.json before any step uses them.
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          known = [l["code"] for l in json.load(open("scripts/i18n.json"))["languages"]]
          requested = os.environ["REQUESTED"].split() or known
          unknown = [code for code in requested if code not in known]
          if unknown:
              sys.exit(f"unknown language code(s): {' '.join(unknown)}")
          if not os.environ["LIMIT"].isdigit():
              sys.exit("limit must be a whole number")
          print("all=" + " ".join(known))
          print("run=" + " ".join(requested))
          print("limit=" + os.environ["LIMIT"])
          EOF

      - name: Restore previous translations
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ALL: ${{ steps.langs.outputs.all }}
        run: |
          if git fetch --depth=1 origin translations; then
            for code in $ALL; do
              git checkout FETCH_HEAD -- "i18n/$code" 2>/dev/null || echo "no previous $code translations"
            done
            git reset --quiet
          else
            echo "No translations branch yet - starting from scratch."
          fi

      - name: Install the Anthropic SDK
        if: env.ANTHROPIC_API_KEY != ''
        run: python3 -m pip install --quiet "anthropic>=1.9,<2"

      - name: Translate
        if: env.ANTHROPIC_API_KEY != ''
        timeout-minutes: 300
        env:
          RUN: ${{ steps.langs.outputs.run }}
          LIMIT: ${{ steps.langs.outputs.limit }}
        run: |
          for code in $RUN; do
            python3 scripts/translate_lessons.py --lang "$code" --limit "$LIMIT"
          done

      - name: Publish to the translations branch
        if: always() && env.ANTHROPIC_API_KEY != '' && steps.langs.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B translations
          git add i18n
          git commit --quiet -m "chore(i18n): machine-translated lessons for ${GITHUB_SHA::7}" \
            -m "Generated by the Translate Lessons workflow from main@${GITHUB_SHA}. Do not edit by hand."
          git push --force origin translations

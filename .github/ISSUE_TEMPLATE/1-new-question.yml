name: 🆕 New question
description: Suggest an interview question this guide does not answer yet.
title: "[question] "
labels: ["new-question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for improving the guide. Before filing, please search the repository for the question - most topics already cover the common phrasings, and the answer may exist under a different wording.

        If you already have the answer written, you can skip this and open a pull request directly; see [CONTRIBUTING.md](https://github.com/mchittineni/ultimate-devops-guide/blob/main/CONTRIBUTING.md).

  - type: input
    id: question
    attributes:
      label: The question
      description: Phrase it the way an interviewer would ask it. Question files are titled as questions, so this becomes the title of the answer.
      placeholder: How do you debug a Kubernetes Ingress that returns 404 for a valid path?
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Which topic does it belong to?
      description: The directory the answer should live in. Pick the closest match - a maintainer will confirm.
      options:
        - advanced-devops-cloud
        - api-gateway-and-service-mesh
        - aws-engineering
        - azure-engineering
        - backup-and-disaster-recovery
        - cicd
        - cloud-cost-optimization
        - cloud-engineering
        - cloud-migration
        - cloud-native-architecture
        - cloud-platforms
        - configuration-management
        - container-orchestration-advanced
        - core-devops-concepts
        - database-management-in-devops
        - devops-culture-and-practices
        - devops-metrics-and-kpis
        - devops-tools-and-automation
        - devsecops
        - docker
        - gcp-engineering
        - incident-management
        - infrastructure-as-code
        - infrastructure-monitoring
        - interview-experience
        - kubernetes
        - linux-administration
        - monitoring-and-logging
        - network-security
        - performance-testing
        - platform-engineering
        - scalability-and-high-availability
        - scripting-and-automation
        - secops
        - security-and-compliance
        - serverless-architecture
        - site-reliability-engineering
        - sla-management
        - slo-engineering
        - version-control
        - "Not sure / needs a new topic"
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Roughly the level of candidate this is asked of.
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is it worth adding?
      description: Where you have seen it asked, how often, and what the existing answers do not cover. "Asked in three of my last five interviews" is the strongest case.
      placeholder: |
        Asked in two recent platform-engineering screens. The existing Ingress answer covers exposing an app but not path/host routing failures or IngressClass mismatches.
    validations:
      required: true

  - type: textarea
    id: draft
    attributes:
      label: Draft answer (optional)
      description: Even rough bullets help. Mechanism, one trade-off, and a command or manifest is enough to work from.
      placeholder: |
        - Check the IngressClass matches the controller that is actually running
        - kubectl describe ingress - look for the default-backend rewrite
        - Then the Service/endpoint layer, then the controller logs
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the repository and this question is not already answered under a different wording.
          required: true
        - label: This is a technical question, not content covered by an NDA or a take-home assignment.
          required: true
